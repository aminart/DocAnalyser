name: Build macOS app

# Fabrique DocAnalyser.app sur des Mac de GitHub, une fois pour les Mac Apple (M1 et suivants), une fois pour
# les Mac Intel :
# - à la main (onglet Actions), ou sur une PR qui touche à la fabrication : les images disque sont disponibles en artefacts « DocAnalyser-mac-… » ;
# - à chaque release publiée (tag vX.Y.Z) : elles sont en plus jointes à la release, sous les noms
#   DocAnalyser-X.Y.Z-mac-apple.dmg et DocAnalyser-X.Y.Z-mac-intel.dmg. Le tag doit correspondre au fichier VERSION.
#
# L'app n'est signée que localement (« ad hoc ») : sans compte Apple Developer, ni signature d'éditeur ni
# notarisation. Au premier lancement, macOS la bloque : voir README, « Mac : l'application ».

on:
  workflow_dispatch:
  # Vérification sur une PR qui touche à la fabrication de l'app (sans rien publier)
  pull_request:
    paths:
      - DocAnalyser.spec
      - backend/launcher.py
      - backend/requirements.txt
      - icone/**
      - .github/macos/**
      - .github/workflows/build-macos-app.yml
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            variante: apple
          - runner: macos-15-intel
            variante: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "DocAnalyser $version ($(uname -m))"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Le tag $tag ne correspond pas au fichier VERSION ($version). Lancer scripts/bump_version.py avant la release."
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Application
        env:
          # Compatible avec macOS 11 et suivants
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          python -m pip install --upgrade pip
          # Paquets déjà compilés seulement pour cryptography : compilé ici (Mac Intel, sans paquet tout prêt pour
          # sa dernière version), il se lie à l'OpenSSL de Homebrew, plus récent que celui embarqué par l'app.
          pip install --prefer-binary --only-binary cryptography -r backend/requirements.txt pyinstaller
          pip list | grep -i -E "^(cryptography|pydantic.core) "
          pyinstaller --noconfirm DocAnalyser.spec
          # Signature locale de l'ensemble (obligatoire sur les Mac Apple), vérifiée
          codesign --force --deep --sign - dist/DocAnalyser.app
          codesign --verify --deep --strict dist/DocAnalyser.app

      - name: Vérification
        run: |
          app=dist/DocAnalyser.app/Contents/MacOS/DocAnalyser
          "$app" --version
          "$app" --no-browser --port 8599 &
          for i in $(seq 90); do
            if curl -sf http://127.0.0.1:8599/health; then
              # Page d'accueil servie depuis l'intérieur de l'app
              curl -sf http://127.0.0.1:8599/ | grep -qi "<html" && exit 0
              echo "::error::L'interface n'est pas servie"
              exit 1
            fi
            sleep 1
          done
          echo "::error::L'app ne répond pas sur /health"
          exit 1

      - name: Image disque
        id: dmg
        run: |
          base="DocAnalyser-${{ steps.version.outputs.version }}-mac-${{ matrix.variante }}"
          mkdir -p "dist/dmg"
          cp -R dist/DocAnalyser.app dist/dmg/
          ln -s /Applications "dist/dmg/Applications"
          cp .github/macos/LISEZ-MOI.txt "dist/dmg/LISEZ-MOI.txt"
          # hdiutil échoue parfois sur les machines de GitHub (« Resource busy ») : quelques essais
          for essai in 1 2 3 4 5; do
            hdiutil create -volname "DocAnalyser" -srcfolder dist/dmg -ov -format UDZO "dist/$base.dmg" && break
            sleep 5
          done
          test -f "dist/$base.dmg"
          echo "fichier=dist/$base.dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DocAnalyser-mac-${{ matrix.variante }}
          path: ${{ steps.dmg.outputs.fichier }}
          if-no-files-found: error

      - name: Joindre l'image disque à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.dmg.outputs.fichier }}" --clobber
